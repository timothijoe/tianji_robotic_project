[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-joint-ws"
version = "0.1.0"
description = "Pure MuJoCo dual-arm chopping MVP for twin_joint_ws"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mujoco==3.10.0",
  "numpy==2.5.1",
]

[project.scripts]
twin-sim = "twin_sim.cli:main"
tianji-robot = "tianji_robotics.cli:main"

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
]
wuji-offline = [
  "mcap>=1.3,<2",
  "wuji-sdk>=2026.7.21",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["twin_sim*", "tianji_robotics*"]

[tool.pytest.ini_options]
testpaths = ["tests/simulation"]
pythonpath = ["src"]
