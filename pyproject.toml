[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-joint-ws"
version = "0.1.0"
description = "Pure MuJoCo dual-arm chopping MVP for twin_joint_ws"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.1",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
]

[project.scripts]
twin-chop = "twin_mujoco.cli:main"
twin-trajectory = "twin_control.trajectory_demo:main"
twin-chop-sdk = "twin_control.chopping_cli:main"
twin-ik = "twin_control.ik_cli:main"

[tool.setuptools]
packages = ["twin_control", "twin_core", "twin_description", "twin_mujoco"]

[tool.setuptools.package-dir]
twin_control = "src/twin_control"
twin_core = "src/twin_core/twin_core"
twin_description = "src/twin_description/twin_description"
twin_mujoco = "src/twin_mujoco/twin_mujoco"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/twin_core", "src/twin_description", "src/twin_mujoco"]
