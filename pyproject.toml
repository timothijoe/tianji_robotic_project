[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-joint-ws"
version = "0.1.0"
description = "Pure MuJoCo dual-arm chopping MVP for twin_joint_ws"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.1",
  "numpy>=1.24",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
]

[project.scripts]
twin-sim = "twin_sim.cli:main"

[tool.setuptools]
packages = ["twin_sim", "twin_sim.tasks"]

[tool.setuptools.package-dir]
twin_sim = "src/twin_sim"
"twin_sim.tasks" = "src/twin_sim/tasks"

[tool.pytest.ini_options]
testpaths = ["tests/simulation"]
pythonpath = ["src"]
